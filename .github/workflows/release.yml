name: release-record

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tagged commit and annotation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned acceptance runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.0
          cache: npm
      - name: Verify the bundled package manager
        run: test "$(npm --version)" = "11.19.1"
      - name: Validate the annotated release record
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release.ts --verify-tag "$RELEASE_TAG"
